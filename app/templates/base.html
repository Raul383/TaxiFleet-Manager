<!DOCTYPE html>
<html lang="ro" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>TaxiFleet Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold text-warning" href="/">TaxiFleet Manager</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/">Dashboard</a>
      <a class="nav-link" href="/autovehicule">Autovehicule</a>
      <a class="nav-link" href="/soferi">Șoferi</a>
      <a class="nav-link" href="/documente">Documente (XOR)</a>
      <a class="nav-link" href="/ture">Ture (RB2)</a>
      <a class="nav-link" href="/atribuiri">Atribuiri (M:N)</a>
      <a class="nav-link text-info fw-semibold" href="/rapoarte">Rapoarte SQL (20)</a>
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
